name: Test Root bot

# Runs the bot against your Root test community (the "-test" community Root made
# when you generated a DEV_TOKEN). To start a test, change the number in
# root-bot/test-run.txt (how many minutes to run) and commit. Ask Claude, or edit it in the GitHub app.
on:
  push:
    paths:
      - "root-bot/test-run.txt"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How many minutes to keep the bot running (max 330)"
        default: "60"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        working-directory: root-bot
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install and build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Run the bot in the test community
        env:
          DEV_TOKEN: ${{ secrets.ROOT_DEV_TOKEN }}
          MINUTES_INPUT: ${{ inputs.minutes }}
        run: |
          if [ -z "$DEV_TOKEN" ]; then
            echo "::error::Add a ROOT_DEV_TOKEN secret first (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          MINUTES="${MINUTES_INPUT:-$(grep -o '[0-9]\+' test-run.txt | head -1)}"
          MINUTES="${MINUTES:-60}"
          M=$(( MINUTES > 330 ? 330 : MINUTES ))
          # Clean up common copy/paste extras: spaces, new lines, quotes, a "DEV_TOKEN=" prefix.
          TOKEN="$(printf '%s' "$DEV_TOKEN" | tr -d '[:space:]"' | tr -d "'" | sed 's/^DEV_TOKEN=//')"
          echo "Key length: ${#TOKEN} characters (a DEV_TOKEN is usually 150-250)."
          if [ "${#TOKEN}" -lt 60 ] || ! printf '%s' "$TOKEN" | grep -Eq '^[A-Za-z0-9_-]+$'; then
            echo "::error::ROOT_DEV_TOKEN doesn't look like a DEV_TOKEN. In dev.rootapp.com open your bot > Settings > Generate new dev token, and save that whole value as ROOT_DEV_TOKEN. (It is not the bot ID or the upload token.)"
            exit 1
          fi
          printf 'DEV_TOKEN=%s\n' "$TOKEN" > .env
          echo "Bot running for $M minutes. Go test it in your -test community on Root!"
          # Write the bot's output to a file (so nothing is lost if it exits suddenly)
          # and stream it here with the huge minified code lines shortened.
          SHORTEN='{ if (length($0) > 400) print substr($0,1,200) " ... " substr($0,length($0)-200); else print; fflush() }'
          : > devhost.log
          tail -n +1 -F devhost.log 2>/dev/null | awk "$SHORTEN" &
          TAIL=$!
          timeout --signal=INT "${M}m" npx rootsdk start devhost > devhost.log 2>&1 || code=$?
          sleep 2; kill $TAIL 2>/dev/null || true
          echo "Bot stopped (exit code ${code:-0})."
          rm -f .env
          # timeout exits 124 when time runs out: that's the normal way this ends.
          if [ "${code:-0}" -ne 0 ] && [ "${code}" -ne 124 ] && [ "${code}" -ne 130 ]; then exit "$code"; fi
