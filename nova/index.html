<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="NOVA: a retro reasoning engine that studied Wikipedia and can search the web.">
<title>Question Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap">
<style>
/* Layout: a cream retro computer — mascot, model dial and brain meter on the case, warm phosphor terminal, keys below.
   Case follows the viewer's theme; the glowing screen stays the same in both. */
:root {
  --page: #e9e0d1;
  --case: #f5f0e6;
  --case-hi: #fffaf2;
  --case-shade: #d8ccb9;
  --case-ink: #5b4a3e;
  --key: #e8dece;
  --key-shadow: #b9aa94;
  --glass: #231a15;
  --glass-mid: #33261e;
  --phos: #f1b48f;
  --accent: #d97757;
  --dim: #a07b66;
  --you: #f7ecdc;
  --f-label: "Press Start 2P", "Courier New", monospace;
  --f-term: "VT323", "Courier New", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #171310; --case: #2d2621; --case-hi: #3a312a; --case-shade: #1d1814; --case-ink: #cdbcaa;
    --key: #3d342c; --key-shadow: #141110; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #171310; --case: #2d2621; --case-hi: #3a312a; --case-shade: #1d1814; --case-ink: #cdbcaa;
  --key: #3d342c; --key-shadow: #141110; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--page); color: var(--case-ink); font-family: var(--f-term); font-size: 22px; line-height: 1.2;
  margin: 0; display: flex; flex-direction: column; box-sizing: border-box;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 12px;
}
.computer {
  flex: 1; min-height: 0; width: 100%; max-width: 940px; margin: 0 auto; box-sizing: border-box;
  background: linear-gradient(180deg, var(--case-hi), var(--case));
  border-radius: 20px; padding: 14px 16px 12px;
  box-shadow: inset 0 -4px 0 var(--case-shade), 0 12px 28px #0000002e;
  display: flex; flex-direction: column; gap: 12px;
}
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
#mascot { width: 70px; height: 65px; image-rendering: pixelated; flex-shrink: 0; }
.who { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 220px; }
.name { font-family: var(--f-label); font-size: 13px; color: var(--accent); letter-spacing: .06em; }
.tag { font-size: 19px; color: var(--case-ink); }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.dial { display: flex; gap: 0; border-radius: 6px; overflow: hidden; box-shadow: 0 3px 0 var(--key-shadow); }
.dial button {
  font-family: var(--f-label); font-size: 8px; letter-spacing: .08em; color: var(--case-ink); background: var(--key);
  border: 0; border-right: 1px solid var(--key-shadow); padding: 9px 10px; cursor: pointer;
}
.dial button:last-child { border-right: 0; }
.dial button[aria-pressed="true"] { background: var(--accent); color: #fff7ef; }
.meter { display: flex; align-items: center; gap: 8px; }
.meter-label { font-family: var(--f-label); font-size: 8px; letter-spacing: .1em; font-variant-numeric: tabular-nums; }
.cells { display: flex; gap: 2px; }
.cells i { width: 6px; height: 12px; background: var(--case-shade); border-radius: 1px; }
.cells i.on { background: var(--accent); box-shadow: 0 0 5px #d9775788; }

.screen {
  position: relative; flex: 1; min-height: 0; border-radius: 16px / 22px; overflow: hidden;
  background: radial-gradient(ellipse at center, var(--glass-mid) 0%, var(--glass) 78%);
  box-shadow: inset 0 0 36px #000c, 0 0 0 4px var(--case-shade);
  display: flex; flex-direction: column; color: var(--phos);
  text-shadow: 0 0 4px #f1b48faa, 0 0 12px #d9775744;
}
.screen::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2; background: repeating-linear-gradient(0deg, #0000004d 0 1px, transparent 1px 3px); }
.screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3; background: radial-gradient(ellipse at 28% 8%, #ffffff10, transparent 45%); animation: flicker 5s infinite steps(1); }
@keyframes flicker { 0%,100% { opacity: 1 } 47% { opacity: .86 } 48% { opacity: 1 } 81% { opacity: .94 } }
#out { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 18px; white-space: pre-wrap; overflow-wrap: anywhere; scrollbar-color: var(--dim) transparent; }
.line { margin: 0 0 4px; }
.you { color: var(--you); text-shadow: 0 0 4px #f7ecdc88; margin-top: 10px; }
.step { color: var(--dim); text-shadow: none; padding-left: 1.2em; }
.ans { color: var(--phos); }
.ans.big { color: var(--accent); text-shadow: 0 0 6px #d97757aa; }
.sys { color: var(--dim); text-shadow: none; }
.cmd-row { display: flex; align-items: center; gap: 8px; padding: 10px 18px 14px; border-top: 2px dashed #5a4335; }
.prompt { color: var(--accent); flex-shrink: 0; }
#q { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--you); font: inherit; caret-color: var(--accent); text-shadow: 0 0 4px #f7ecdc66; }
#q::placeholder { color: #7d5f4f; text-shadow: none; }
.cursor { display: inline-block; width: .55em; height: 1em; background: var(--phos); vertical-align: -0.12em; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0 } }

.keys { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.key {
  font-family: var(--f-label); font-size: 9px; letter-spacing: .08em; color: var(--case-ink);
  background: var(--key); border: 0; border-radius: 5px; padding: 10px 12px; cursor: pointer; box-shadow: 0 3px 0 var(--key-shadow);
}
.key.hot { background: var(--accent); color: #fff7ef; box-shadow: 0 3px 0 #9c4a30; }
.key:active, .dial button:active { transform: translateY(2px); }
.key:focus-visible, .dial button:focus-visible, #q:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.key:disabled { opacity: .5; cursor: default; }
#autoBtn[aria-pressed="false"] { opacity: .7; }
.reader {
  position: absolute; inset: 0; z-index: 4; background: #231a15f2; display: flex; flex-direction: column; gap: 10px;
  padding: 16px 18px; box-sizing: border-box;
}
.reader[hidden] { display: none; }
.reader h2 { margin: 0; font-family: var(--f-label); font-size: 11px; color: var(--accent); letter-spacing: .08em; font-weight: 400; }
.reader p { margin: 0; color: var(--dim); text-shadow: none; font-size: 19px; }
#readText {
  flex: 1; min-height: 100px; resize: none; background: #1a130f; color: var(--you); border: 2px dashed #5a4335; border-radius: 8px;
  padding: 10px 12px; font: 20px/1.25 var(--f-term); outline: none;
}
#readText:focus-visible { border-color: var(--accent); }
.reader .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 600px) {
  body { font-size: 19px; } .computer { padding: 10px; border-radius: 14px; }
  .side { align-items: flex-start; width: 100%; } .tag { font-size: 17px; } .keys { justify-content: flex-start; }
}
@media (prefers-reduced-motion: reduce) { .screen::after, .cursor { animation: none; } }

[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
</style>
</head>
<body>

<div class="computer">
  <div class="top">
    <canvas id="mascot" width="140" height="130" aria-label="NOVA mascot" role="img"></canvas>
    <div class="who">
      <div class="name" id="mname">NOVA-2 SCHOLAR</div>
      <div class="tag" id="tag">Loading...</div>
    </div>
    <div class="side">
      <div class="dial" role="group" aria-label="Choose a model">
        <button type="button" data-model="blank" aria-pressed="false">BLANK</button>
        <button type="button" data-model="scholar" aria-pressed="true">SCHOLAR</button>
        <button type="button" data-model="mini" aria-pressed="false">MINI</button>
      </div>
      <div class="meter" aria-live="polite">
        <div class="meter-label" id="meterLabel">BRAIN: 0</div>
        <div class="cells" id="cells"></div>
      </div>
    </div>
  </div>
  <div class="screen">
    <div id="out" aria-live="polite"></div>
    <div class="reader" id="reader" hidden>
      <h2>READ &amp; LEARN</h2>
      <p>Paste any factual text, like the opening paragraph of a Wikipedia article. I'll read it and teach myself the facts I can understand.</p>
      <textarea id="readText" placeholder="Paste text here..." aria-label="Text for NOVA to read"></textarea>
      <div class="row">
        <button class="key" type="button" id="readSample">SAMPLE TEXT</button>
        <button class="key" type="button" id="readCancel">CANCEL</button>
        <button class="key hot" type="button" id="readGo">LEARN IT</button>
      </div>
    </div>
    <form class="cmd-row" id="form" autocomplete="off">
      <label class="prompt" for="q">&gt;</label>
      <input id="q" type="text" placeholder="Ask a question or teach me a fact..." spellcheck="false">
    </form>
  </div>
  <div class="keys">
    <button class="key hot" type="button" id="readBtn">READ &amp; LEARN</button>
    <button class="key" type="button" id="wikiBtn">SEARCH WEB</button>
    <button class="key" type="button" id="autoBtn" aria-pressed="true">AUTO-LEARN: ON</button>
    <button class="key" type="button" id="surprise">SURPRISE ME</button>
    <button class="key" type="button" id="demo">DEMO LESSON</button>
    <button class="key" type="button" data-cmd="topics">TOPICS</button>
    <button class="key" type="button" data-cmd="what do you know">MY BRAIN</button>
    <button class="key" type="button" data-cmd="help">HELP</button>
    <button class="key" type="button" id="reset">RESET BRAIN</button>
  </div>
</div>

<script>
(() => {
/* ================= NOVA reasoning engine v3 ================= */
const fmt = v => Number.isInteger(v) ? String(v) : String(+v.toPrecision(10));
const LEAD = /^(a|an|the|all|every|each|some|any)\s+/;
function sing(w) {
  if (/ies$/.test(w) && w.length > 4) return w.slice(0, -3) + "y";
  if (/(ss|us|is|ous|ics)$/.test(w)) return w;
  if (/(ches|shes|xes|sses)$/.test(w)) return w.slice(0, -2);
  if (/s$/.test(w) && w.length > 3) return w.slice(0, -1);
  return w;
}
function clean(t) { return String(t).toLowerCase().replace(/[’]/g, "'").replace(/[.!?,;:]+$/g, "").replace(/["“”]/g, "").replace(/\s+/g, " ").trim(); }
function ent0(t) {
  t = clean(t).replace(/'/g, ""); let p;
  while ((p = t.replace(LEAD, "")) !== t) t = p;
  if (!t) return "";
  const ws = t.split(" "); ws[ws.length - 1] = sing(ws[ws.length - 1]);
  return ws.join(" ");
}
const ALIAS = new Map();
const ent = t => { const k = ent0(t); return ALIAS.get(k) || k; };
function alias(a, canon) { ALIAS.set(ent0(a), ent0(canon)); }
const an = w => (/^[aeiou]/i.test(w) && !/^(us\b|uni|use|eu|one\b)/i.test(w) ? "an " : "a ") + w;
const plural = w => /[^aeiou]y$/.test(w) ? w.slice(0, -1) + "ies" : /(s|x|ch|sh)$/.test(w) ? w + "es" : w + "s";
const canonVerb = t => { const ws = clean(t).split(" "); ws[ws.length - 1] = sing(ws[ws.length - 1]); return ws.join(" "); };
const DISP = new Map();
function reg(text) {
  let t = String(text).trim().replace(/[.!?]+$/, ""), p;
  while ((p = t.replace(/^(a|an|the|all|every|each|some|any)\s+/, "")) !== t) t = p; // lowercase articles only
  const k = ent(t); if (k && !DISP.has(k)) DISP.set(k, t === t.toLowerCase() && !/\d/.test(t) ? k : t); return k;
}
const disp = k => DISP.get(k) || k;

const OPP = { bigger: "smaller", larger: "smaller", taller: "shorter", longer: "shorter", faster: "slower", older: "younger", heavier: "lighter", stronger: "weaker", higher: "lower", hotter: "colder", warmer: "colder", richer: "poorer", better: "worse", louder: "quieter", wider: "narrower", deeper: "shallower", farther: "closer" };
const REV = {}; for (const [a, b] of Object.entries(OPP)) if (!REV[b]) REV[b] = a;
const SYN = { larger: "bigger", longer: "taller", further: "farther", nearer: "closer" };
function canonCmp(w) { w = SYN[w] || w; if (REV[w]) return { w: REV[w], flip: true }; return { w, flip: false }; }

/* ---------------- models ---------------- */
const MODELS = {
  blank:   { id: "blank",   name: "NOVA-1 BLANK",   key: "nova1-brain-v2", pack: false, chain: true,  steps: true,  color: "#d97757", tip: "#f1b48f",
             tag: "Starts knowing nothing. Learns only from you." },
  scholar: { id: "scholar", name: "NOVA-2 SCHOLAR", key: "nova2-scholar",  pack: true,  chain: true,  steps: true,  color: "#c98a3c", tip: "#ffe2a8",
             tag: "Knowledge pack loaded. Reasons and shows its working." },
  mini:    { id: "mini",    name: "NOVA-2 MINI",    key: "nova2-mini",     pack: true,  chain: false, steps: false, color: "#c46a6a", tip: "#ffd35a",
             tag: "Knowledge pack, fast short answers. No chaining." },
};
let model = MODELS.scholar;
let brain = { facts: [], nums: {} };
let BYS = new Map(), BYO = new Map(), NUMS = {};
const PACK = [], PACKNUMS = {};
const subj = x => BYS.get(x) || [], obj = x => BYO.get(x) || [];
function rebuild() {
  BYS = new Map(); BYO = new Map();
  const all = model.pack ? brain.facts.concat(PACK) : brain.facts; // your facts first, so they win
  for (const f of all) {
    if (!BYS.has(f.s)) BYS.set(f.s, []); BYS.get(f.s).push(f);
    if (!BYO.has(f.o)) BYO.set(f.o, []); BYO.get(f.o).push(f);
  }
  NUMS = model.pack ? { ...PACKNUMS, ...brain.nums } : { ...brain.nums };
}
function save() { try { localStorage.setItem(model.key, JSON.stringify(brain)); } catch (e) {} }
function useModel(id) {
  model = MODELS[id] || MODELS.scholar; brain = { facts: [], nums: {} };
  try { const b = JSON.parse(localStorage.getItem(model.key) || "null"); if (b && Array.isArray(b.facts) && b.nums) brain = b; } catch (e) {}
  (brain.aliases || []).forEach(([a, c]) => alias(a, c));
  rebuild();
}
const brainSize = () => brain.facts.length + Object.keys(brain.nums).length;
const packSize = () => model.pack ? PACK.length + Object.keys(PACKNUMS).length : 0;

/* ---------------- memory ---------------- */
const NEG = { is: "isnt", can: "cant", has: "hasnt" };
const POS = { isnt: "is", cant: "can", hasnt: "has" };
function addFact(f) {
  const opp = NEG[f.r] || POS[f.r];
  brain.facts = brain.facts.filter(g => !(g.s === f.s && g.o === f.o && (g.r === f.r || g.r === opp) && g.w === f.w && g.k === f.k));
  if (f.r === "cmp") brain.facts = brain.facts.filter(g => !(g.r === "cmp" && g.w === f.w && g.s === f.o && g.o === f.s));
  if (f.r === "attr") brain.facts = brain.facts.filter(g => !(g.r === "attr" && g.k === f.k && g.s === f.s));
  brain.facts.push(f); save(); rebuild();
}
const PHRASE = {
  inventor: "{s} was invented by {o}", "year invented": "{s} was invented in {o}", author: "{s} was written by {o}",
  painter: "{s} was painted by {o}", sculptor: "{s} was sculpted by {o}", composer: "{s} was composed by {o}",
  discoverer: "{s} was discovered by {o}", "year discovered": "{s} was discovered in {o}", year: "{s} happened in {o}",
  "year built": "{s} was built in {o}", "year born": "{s} was born in {o}", "year written": "{s} was written in {o}",
  description: "{s}: {o}", developer: "{s} was developed by {o}", performer: "{s} is by {o}", director: "{s} was directed by {o}",
  builder: "{s} was built by {o}", meaning: "{s} means: {o}", "next to": "{s} is next to {o}", "head of government": "the head of government of {s} is {o}", birthplace: "{s} was born in {o}", "head of state": "the head of state of {s} is {o}", country: "{s} is in {o}", creator: "{s} was created by {o}", publisher: "{s} was published by {o}", founder: "{s} was founded by {o}", "year founded": "{s} was founded in {o}", "year died": "{s} died in {o}", director: "{s} was directed by {o}", "year made": "{s} was made in {o}", location: "{s} is in {o}", continent: "{s} is in {o}", job: "the job of the {s} is to {o}",
};
function objText(f) { if (f.d) return f.d; const o = disp(f.o); return f.a ? an(o) : o; }
function say(f) {
  const S = disp(f.s);
  switch (f.r) {
    case "is": return `${S} is ${objText(f)}`;
    case "isnt": return `${S} is not ${objText(f)}`;
    case "can": return `${S} can ${f.o}`;
    case "cant": return `${S} cannot ${f.o}`;
    case "has": return `${S} has ${objText(f)}`;
    case "hasnt": return `${S} does not have ${objText(f)}`;
    case "cmp": return `${S} is ${f.w} than ${disp(f.o)}`;
    case "attr":
      if (f.k[0] === "#") return `${S} has ${disp(f.o)} ${f.o === "1" ? f.k.slice(1) : (f.pl || plural(f.k.slice(1)))}`;
      return (PHRASE[f.k] || ("the {k} of {s} " + (/s$/.test(f.k) && !/ss$/.test(f.k) ? "are" : "is") + " {o}")).replace("{k}", f.k).replace("{s}", S).replace("{o}", disp(f.o));
  }
}
const known = x => BYS.has(x) || BYO.has(x) || x in NUMS;

/* ---------------- reasoning ---------------- */
function ancestors(x) {
  const out = [{ node: x, path: [] }];
  if (!model.chain) return out;
  const seen = new Map([[x, []]]), q = [x];
  while (q.length) {
    const n = q.shift();
    for (const f of subj(n)) if (f.r === "is" && !seen.has(f.o)) {
      const p = [...seen.get(n), f]; seen.set(f.o, p); q.push(f.o); out.push({ node: f.o, path: p });
    }
  }
  return out;
}
function pickAt(node, rels, o) {
  let best = null;
  for (const f of subj(node)) if (rels.includes(f.r) && f.o === o) { if (f.u) return f; best = best || f; }
  return best;
}
function query(rel, x, y) {
  for (const { node, path } of ancestors(x)) {
    const f = pickAt(node, [rel, NEG[rel]], y);
    if (f) return { ans: f.r === rel, path: [...path, f] };
  }
  return null;
}
function attrQuery(k, x) {
  for (const { node, path } of ancestors(x)) {
    let fs = subj(node).filter(f => f.r === "attr" && f.k === k);
    if (fs.some(f => f.u)) fs = fs.filter(f => f.u);
    if (fs.length) return { vals: fs, path: [...path, ...fs] };
  }
  return null;
}
function cmpPath(w, a, b) {
  const seen = new Map([[a, []]]), q = [a];
  while (q.length) {
    const n = q.shift();
    for (const f of subj(n)) if (f.r === "cmp" && f.w === w && !seen.has(f.o)) {
      const p = [...seen.get(n), f]; if (f.o === b) return p;
      if (model.chain) { seen.set(f.o, p); q.push(f.o); }
    }
  }
  return null;
}
function compare(word, a, b) {
  const { w, flip } = canonCmp(word);
  const [hi, lo] = flip ? [b, a] : [a, b];
  let p = cmpPath(w, hi, lo); if (p) return { ans: true, path: p };
  p = cmpPath(w, lo, hi); if (p) return { ans: false, path: p };
  return null;
}
function explain(path, conclusion) {
  const steps = path.map(f => "• " + say(f) + (f.u ? (f.src === "read" ? "  (I read this)" : f.src && f.src.startsWith("web:") ? `  (from ${f.src.slice(4)})` : "  (you told me)") : ""));
  if (path.length > 1) steps.push("• chaining these together...");
  if (conclusion) steps.push("∴ " + conclusion);
  return steps;
}
function leaves(x) {
  const seen = new Set([x]), q = [x], out = new Set();
  while (q.length) {
    const n = q.shift(), kids = obj(n).filter(f => f.r === "is");
    if (!kids.length && n !== x) out.add(n);
    for (const f of kids) if (!seen.has(f.s)) { seen.add(f.s); q.push(f.s); }
  }
  return [...out];
}
function describe(x) {
  const lines = [], own = subj(x);
  const show = (arr, max, pre) => { arr.slice(0, max).forEach(t => lines.push(pre + t)); if (arr.length > max) lines.push(`${pre}...and ${arr.length - max} more`); };
  show(own.map(say), 14, "• ");
  show(obj(x).filter(f => f.r === "attr" || f.r === "cmp").map(say), 8, "• ");
  if (model.chain) {
    const inferred = [];
    for (const { node } of ancestors(x).slice(1)) {
      if (!own.some(f => f.r === "is" && f.o === node)) inferred.push(`${disp(x)} is ${an(disp(node))}`);
      for (const f of subj(node)) {
        if (f.r === "is" || f.r === "cmp") continue;
        if (f.r === "attr") { const r = attrQuery(f.k, x); if (r && r.path.includes(f)) inferred.push(say({ ...f, s: x })); continue; }
        const r = query(POS[f.r] || f.r, x, f.o);
        if (r && r.path.includes(f)) inferred.push(`${say({ ...f, s: x })}  (because ${disp(x)} is ${an(disp(node))})`);
      }
    }
    show([...new Set(inferred)], 14, "◇ ");
  }
  const kidFacts = obj(x).filter(f => f.r === "is");
  if (kidFacts.length === 1 && !own.length) lines.push("• " + say(kidFacts[0]));

/* ---------------- surprise questions from the pack ---------------- */
function surprise() {
  const art = k => /^[A-Z0-9]/.test(disp(k)) ? disp(k) : "a " + disp(k);
  const artA = k => /^[A-Z0-9]/.test(disp(k)) ? disp(k) : an(disp(k));

    const f = PACK[Math.floor(Math.random() * PACK.length)];
    if (f.r === "attr") {
      const S = disp(f.s), k = f.k;
      if (k[0] === "#") return `how many ${plural(k.slice(1))} does ${art(f.s)} have?`;
      const Q = { capital: `what is the capital of ${S}?`, inventor: `who invented ${/^[A-Z]/.test(S) ? S : "the " + S}?`, author: `who wrote ${S}?`, painter: `who painted ${S}?`, composer: `who composed ${S}?`, discoverer: `who discovered ${S}?`, sculptor: `who sculpted ${S}?`, location: `where is ${/^[A-Z]/.test(S) ? S : "the " + S}?`, year: `when did ${S} happen?`, "year invented": `when was ${/^[A-Z]/.test(S) ? S : "the " + S} invented?`, symbol: `what is the symbol of ${S}?`, opposite: `what is the opposite of ${S}?`, continent: `where is ${S}?`, language: `what is the language of ${S}?`, currency: `what is the currency of ${S}?` }[k];

    }
    if (f.r === "is" && model.chain && !obj(f.s).some(g => g.r === "is")) {
      const anc = ancestors(f.s).slice(1).filter(a => a.path[a.path.length - 1].a); if (anc.length < 2) continue;

      return `is ${artA(f.s)} ${an(disp(pick.node))}?`;
    }
    if (f.r === "is" && !obj(f.s).some(g => g.r === "is")) {
      const props = []; for (const a of ancestors(f.s).slice(1)) for (const g of subj(a.node)) if (g.r === "can" || g.r === "cant") props.push(g);

    if (f.r === "cmp") return `is ${disp(f.s)} ${f.w} than ${disp(f.o)}?`;

}

async function wikidataFacts(get, qid, topicName) {
  const j = await get(`https://www.wikidata.org/wiki/Special:EntityData/${qid}.json`);
  const ent1 = j && j.entities && Object.values(j.entities)[0];
  if (!ent1 || ent1.missing !== undefined || !ent1.claims) return [];
  const raw = [], need = new Set();
  for (const [p, spec] of Object.entries(WD_PROPS)) {
    const cl = bestClaims(ent1.claims[p]); if (!cl.length) continue;
    const max = spec[0] === "is" ? MULTI_OK.is : (MULTI_OK[spec[1]] || 1);
    for (const c of cl.slice(0, max)) {
      const dv = c.mainsnak.datavalue; if (!dv) continue;
      if (dv.type === "wikibase-entityid") { need.add(dv.value.id); raw.push({ spec, id: dv.value.id }); }
      else if (dv.type === "time" && spec[2] === "year") { const y = wdYear(dv.value.time); if (y) raw.push({ spec, text: y }); }
      else if (dv.type === "quantity" && spec[2] === "num") { const n = wdNum(dv.value); if (n) raw.push({ spec, text: n }); }
    }
  }
  const labels = {};
  const ids = [...need];
  try {
    for (let i = 0; i < ids.length; i += 50) {
      const lj = await get(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${ids.slice(i, i + 50).join("|")}&props=labels&languages=en&format=json&origin=*`);
      for (const [id, e] of Object.entries((lj && lj.entities) || {})) if (e.labels && e.labels.en) labels[id] = e.labels.en.value;
    }
  } catch (e) {
    // fallback: fetch the most important values one at a time
    for (const id of ids.slice(0, 12)) { try { const ej = await get(`https://www.wikidata.org/wiki/Special:EntityData/${id}.json`); const en = Object.values(ej.entities)[0]; if (en.labels && en.labels.en) labels[id] = en.labels.en.value; } catch (e2) {} }
  }
  const S = reg(topicName), out = [];
  for (const r of raw) {
    const val = r.text || labels[r.id]; if (!val || /^Q\d+$/.test(val) || ent(val) === S) continue;
    if (r.spec[0] === "is") {
      if (/^(human|taxon|Wikimedia|class of|type of|entity|item|concept)\b/i.test(val) && val !== "human") continue;

    } else out.push({ r: "attr", k: r.spec[1], s: S, o: reg(val) });
  }
  const desc = ent1.descriptions && ent1.descriptions.en && ent1.descriptions.en.value;
  return { facts: out, desc };
}

async function wiktionaryFacts(get, word) {
  const j = await get(`https://en.wiktionary.org/api/rest_v1/page/definition/${encodeURIComponent(word.toLowerCase().replace(/ /g, "_"))}`);
  const en = j && j.en; if (!en || !en.length) return [];
  const strip = h => String(h).replace(/<style[\s\S]*?<\/style>/gi, "").replace(/<[^>]+>/g, "").replace(/\.mw-parser-output[\s\S]*$/, "").replace(/\s+/g, " ").trim();
  const out = [];
  for (const sense of en.slice(0, 2)) {
    const d = (sense.definitions || []).map(x => strip(x.definition)).find(t => t && t.length > 3);
    if (d) out.push({ r: "attr", k: "meaning", s: reg(word), o: reg(`(${sense.partOfSpeech.toLowerCase()}) ${d.replace(/\.$/, "")}`) });
  }
  return out;
}

async function searchTitle(get, host, q) {
  let pages = [];
  try { const j = await get(`https://${host}/w/rest.php/v1/search/page?q=${encodeURIComponent(q)}&limit=3`); pages = (j && j.pages) || []; }
  catch (e) { const o = await get(`https://${host}/w/api.php?action=opensearch&search=${encodeURIComponent(q)}&limit=3&namespace=0&format=json&origin=*`); pages = ((o && o[1]) || []).map(t => ({ title: t })); }
  if (!pages.length) return null;
  // prefer a page whose title matches the words asked about
  const qw = clean(q);
  const exact = pages.find(p => clean(p.title) === qw || ent(p.title) === ent(qw));
  return (exact || pages[0]).title;
}
async function introText(get, host, title, sentences) {
  let j;
  try { j = await get(`https://${host}/api/rest_v1/page/summary/${encodeURIComponent(title.replace(/ /g, "_"))}?redirect=true`); }
  catch (e) { if (/404/.test(e.message)) return null; throw e; }
  if (!j || !j.extract || j.type === "https://mediawiki.org/wiki/HyperSwitch/errors/not_found") return null;
  if (j.type === "disambiguation") return { disambig: true, title: j.title };
  return { title: j.title, qid: j.wikibase_item, text: splitSentences(j.extract.replace(/\n+/g, " ")).slice(0, sentences).join(" ") };
}

/* search everywhere, read everything, return facts grouped by source */
async function webLearn(get, query, progress, wantMeaning) {
  const report = []; let mainTitle = null, topicKey = null;
  const note = t => progress && progress(t);
  const words = query.trim().split(/\s+/);
  // 1. Wikipedia: find the best article
  note(`searching Wikipedia for "${query}"...`);
  let title = null, qid = null;
  try { title = await searchTitle(get, "en.wikipedia.org", query); } catch (e) {
    try { title = await searchTitle(get, "simple.wikipedia.org", query); } catch (e2) { title = query.trim().replace(/^\w/, c => c.toUpperCase()); }
  }
  if (title) {
    mainTitle = title;
    // 2. Simple English Wikipedia first (plain sentences), then the full article's intro
    for (const [host, label, n] of [["simple.wikipedia.org", "Simple English Wikipedia", 8], ["en.wikipedia.org", "Wikipedia", 6]]) {
      try {
        note(`reading "${title}" on ${label}...`);
        const it = await introText(get, host, title, n);
        if (it && it.disambig) { report.push({ src: label, disambig: it.title }); break; }
        if (it && it.qid) qid = qid || it.qid;
        if (it && it.text) { const r = learnFromText(it.text); if (r.topic) topicKey = topicKey || r.topic; report.push({ src: label, title: it.title, facts: r.facts }); }
      } catch (e) { report.push({ src: label, err: true }); }
    }
    // 3. Wikidata: exact structured facts about the same article
    if (qid) try {
      note(`checking Wikidata for "${title}"...`);
      const name = topicKey ? disp(topicKey) : title;
      const wd = await wikidataFacts(get, qid, name);
      if (wd && wd.facts) report.push({ src: "Wikidata", title, facts: wd.facts, desc: wd.desc });
    } catch (e) { report.push({ src: "Wikidata", err: true }); }
  }
  // 4. Wiktionary for single words (meanings)
  const gotWiki = report.some(r => r.facts && r.facts.length);
  if (words.length <= 2 && (wantMeaning || !gotWiki)) {
    try { note(`looking up "${query}" in Wiktionary...`); const wf = await wiktionaryFacts(get, query); if (wf.length) report.push({ src: "Wiktionary", facts: wf }); } catch (e) {}
  }
  return { report, title: mainTitle, topic: topicKey };
}

function addFacts(list) {

  for (const f of list) {
    const opp = NEG[f.r] || POS[f.r];
    brain.facts = brain.facts.filter(g => inList.has(g) || !((g.s === f.s && g.o === f.o && (g.r === f.r || g.r === opp) && g.w === f.w && g.k === f.k) || (f.r === "attr" && g.r === "attr" && g.k === f.k && g.s === f.s)));
    brain.facts.push(f);
  }

}
function applyWeb(res, query) {
  const seen = new Set(), bySrc = [];
  for (const r of res.report) {
    if (!r.facts || !r.facts.length) continue;
    const keep = r.facts.filter(f => { const k = [f.r, f.k || "", f.s, f.o].join("|"); if (seen.has(k)) return false; seen.add(k); return true; });
    keep.forEach(f => { f.u = 1; f.src = "web:" + r.src; });
    if (keep.length) bySrc.push({ src: r.src, facts: keep });
  }
  const all = bySrc.flatMap(b => b.facts);
  if (all.length) addFacts(all);
  const name = res.topic ? disp(res.topic) : res.title;
  if (all.length && name) { learnAlias(query, name); if (res.title) learnAlias(res.title, name); }
  return { total: all.length, bySrc, name };
}

    if (m) { if (!hasIs.has(ent(m[2]))) alias(m[2], n); } else alias((key === "lakes" ? "Lake " : "Mount ") + n, n);
  }
  PS(`a film is a work of art
a book is a written work
a painting is a work of art
a video game is a game
an album is a music recording
a volcano is a mountain
a sea is a body of water
an island is a landform
a company is an organization
a city is a settlement`);
  STUDIED.entities = studied.size; STUDIED.facts = PACK.length - before;
})();


// ================= mascot (original pixel character, one look per model) =================
const cv = document.getElementById("mascot"), cx = cv.getContext("2d"), S = 10;
const BODY = [
  "......t.......",
  "......a.......",
  "...oooooooo...",
  "..oooooooooo..",
  ".oooooooooooo.",
  ".oooooooooooo.",
  ".oooooooooooo.",
  ".oooooooooooo.",
  ".occoooooocco.",
  "..oooooooooo..",
  "...ssssssss...",
  "...ff....ff...",
];
const FACES = {
  idle:     { e: [[3,5,"w"],[4,5],[3,6],[4,6],[9,5,"w"],[10,5],[9,6],[10,6]], m: [[6,8],[7,8]] },
  blink:    { e: [[3,6],[4,6],[9,6],[10,6]], m: [[6,8],[7,8]] },
  think:    { e: [[4,4,"w"],[5,4],[4,5],[5,5],[10,4,"w"],[11,4],[10,5],[11,5]], m: [[7,8]] },
  happy:    { e: [[2,6],[3,5],[4,6],[9,6],[10,5],[11,6]], m: [[5,8],[8,8],[6,9],[7,9]] },
  confused: { e: [[3,5,"w"],[4,5],[3,6],[4,6],[10,6]], m: [[5,9],[6,8],[7,9],[8,8]] },
};
const GLASSES = [[2,4],[3,4],[4,4],[5,4],[8,4],[9,4],[10,4],[11,4],[6,5],[7,5],[2,5],[2,6],[2,7],[5,5],[5,6],[5,7],[3,7],[4,7],[8,5],[8,6],[8,7],[11,5],[11,6],[11,7],[9,7],[10,7]];
const BOLT = [[7,0],[6,1],[7,1]];
let mood = "idle", blinkOn = false, frame = 0;
const shade = (hex, k) => { const n = parseInt(hex.slice(1), 16); const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(v * k)))); return "#" + c.map(v => v.toString(16).padStart(2, "0")).join(""); };
function draw() {
  const base = model.color;
  const C = { o: base, c: shade(base, 1.18), s: shade(base, .82), f: shade(base, .62), a: "#8f6b58", e: "#231a15", w: "#fff4e8", m: "#231a15" };
  const glow = mood === "think" ? (frame % 2 ? "#fff1d6" : model.tip) : mood === "happy" ? "#fff1d6" : model.tip;
  cx.clearRect(0, 0, cv.width, cv.height);
  const dy = mood === "think" && frame % 2 ? 1 : 0;
  const px = (x, y, col) => { cx.fillStyle = col; cx.fillRect(x * S, (y + dy) * S, S, S); };
  BODY.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== ".") px(x, y, ch === "t" ? glow : C[ch]); }));
  if (model.id === "mini") BOLT.forEach(([x, y]) => px(x, y, glow));
  if (model.id === "scholar") GLASSES.forEach(([x, y]) => px(x, y, "#3a2a20"));
  const face = FACES[blinkOn && mood === "idle" ? "blink" : mood];
  face.e.forEach(([x, y, k]) => px(x, y, k ? C.w : C.e));
  face.m.forEach(([x, y]) => px(x, y, C.m));
}
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
setInterval(() => { frame++; if (mood === "think") draw(); }, 220);
(function blinkLoop() { setTimeout(() => { if (!reduced) { blinkOn = true; draw(); setTimeout(() => { blinkOn = false; draw(); }, 140); } blinkLoop(); }, 2600 + Math.random() * 2400); })();
let moodTimer;
function setMood(m, hold) {
  clearTimeout(moodTimer); mood = m; draw();
  document.getElementById("tag").textContent = { idle: model.tag, think: "Thinking it through...", happy: "Got it!", confused: "Hmm, I don't know that yet." }[m];
  if (hold) moodTimer = setTimeout(() => setMood("idle"), hold);
}

// ================= brain meter =================
function updateMeter() {
  const n = packSize() + brainSize(), cells = document.getElementById("cells");
  document.getElementById("meterLabel").textContent = `BRAIN: ${n.toLocaleString()} FACT${n === 1 ? "" : "S"}`;
  if (!cells.children.length) for (let i = 0; i < 14; i++) cells.append(document.createElement("i"));
  const lit = n ? Math.min(14, Math.ceil(Math.log10(n + 1) * 3.5)) : 0;
  [...cells.children].forEach((c, i) => c.classList.toggle("on", i < lit));
}

// ================= terminal =================
const out = document.getElementById("out"), q = document.getElementById("q"), form = document.getElementById("form");
let queue = Promise.resolve();
const scroll = () => { out.scrollTop = out.scrollHeight; };
const wait = ms => new Promise(r => setTimeout(r, reduced ? 0 : ms));
function print(text, cls, instant) {
  queue = queue.then(() => new Promise(done => {
    const el = document.createElement("div"); el.className = "line" + (cls ? " " + cls : ""); out.append(el);
    if (instant || reduced) { el.textContent = text; scroll(); return done(); }
    const cur = document.createElement("span"); cur.className = "cursor"; let i = 0;
    const step = () => { i = Math.min(text.length, i + Math.max(1, Math.round(text.length / 90))); el.textContent = text.slice(0, i); el.append(cur); scroll(); if (i < text.length) setTimeout(step, 12); else { cur.remove(); done(); } };
    step();
  }));
  return queue;
}
const later = fn => { queue = queue.then(fn); return queue; };

function handle(text, shown, retried) {
  const lk = /^(?:look up|lookup|wiki|wikipedia|search for|search|learn about)\s+(.+)$/i.exec(text.trim());
  if (lk && !retried) { print("> " + text, "you", true); lookUp(lk[1].replace(/[?.!]+$/, "")); return queue; }
  print("> " + (shown || text), "you", true);
  later(() => { setMood("think"); return wait(model.id === "mini" ? 120 : 380); });
  let r; try { r = think(text); } catch (e) { r = { answer: "Something in my circuits went wrong with that one. Try asking it another way.", mood: "confused" }; }
  if (!r) return queue;
  if (r.clear) { later(() => { out.textContent = ""; }); print("Screen cleared.", "sys", true); later(() => setMood("idle")); return queue; }
  if (r.reset) {
    brain = { facts: [], nums: {} }; save(); rebuild(); DERIVED = countDerived(); updateMeter();
    print(model.pack ? "Wiped everything you taught me. My knowledge pack stays." : "Brain wiped. I know nothing again.", "ans");
    later(() => setMood("confused", 2500)); return queue;
  }
  const steps = model.steps ? (r.steps || []) : [];
  steps.forEach(s => { print(s, "step", true); later(() => wait(140)); });
  const short = r.answer.length < 48 && !r.answer.includes("\n");
  print(r.answer, "ans" + (short ? " big" : ""));
  if (r.lookup && autoLearn && net !== false && !retried) {
    const topic = r.lookup;
    queue.then(async () => { const ok = await lookUp(topic, true, r.meaning); if (ok) { print("• trying your question again with what I just learned...", "step", true); handle(text, shown, true); } });
    return queue;
  }
  if (r.learned) DERIVED = countDerived();
  later(() => { updateMeter(); setMood(r.mood === "think" ? "happy" : r.mood || "happy", 2600); });
  return queue;
}

let busy = false;
form.addEventListener("submit", e => { e.preventDefault(); const t = q.value.trim(); if (!t || busy) return; q.value = ""; handle(t); });
document.querySelectorAll("[data-cmd]").forEach(b => b.addEventListener("click", () => { if (!busy) handle(b.dataset.cmd); q.focus(); }));
document.querySelector(".screen").addEventListener("click", () => { if (!getSelection().toString()) q.focus(); });

const resetBtn = document.getElementById("reset"); let armed = null;
resetBtn.addEventListener("click", () => {
  if (busy) return;
  if (!armed) { resetBtn.textContent = "SURE? CLICK AGAIN"; armed = setTimeout(() => { armed = null; resetBtn.textContent = "RESET BRAIN"; }, 3000); return; }
  clearTimeout(armed); armed = null; resetBtn.textContent = "RESET BRAIN"; handle("reset brain");
});

async function typeIn(line) {
  await queue; await wait(350);
  for (let i = 1; i <= line.length; i++) { q.value = line.slice(0, i); await wait(24); }
  await wait(160); q.value = ""; handle(line); await queue;
}
document.getElementById("surprise").addEventListener("click", async () => {
  if (busy) return;
  if (!model.pack) { handle("topics"); return; }
  busy = true; await typeIn(surprise()); busy = false; q.focus();
});
const LESSONS = {
  blank: ["is a cat an animal?", "cats are animals", "animals can breathe", "can a cat breathe?", "tom is taller than sam", "sam is taller than ann", "is ann taller than tom?", "solve 2x + 3 = 11"],
  scholar: ["what is the capital of japan?", "can a penguin fly?", "how many legs does a tarantula have?", "is jupiter bigger than mars?", "is albert einstein a mammal?", "zorbs are penguins", "can a zorb swim?"],
  mini: ["what is the capital of kenya?", "who wrote hamlet?", "can a cat breathe?", "is a cat a mammal?"],
};
const demoBtn = document.getElementById("demo");
demoBtn.addEventListener("click", async () => {
  if (busy) return; busy = true; demoBtn.disabled = true;
  print(`— DEMO LESSON for ${model.name} —`, "sys", true);
  for (const line of LESSONS[model.id]) { await typeIn(line); await wait(600); }
  print("— Your turn. —", "sys", true);

});

// ================= internet: Wikipedia =================
const HOME_URL = "https://jai696856.github.io/m/nova/";
let net = null, autoLearn = true;
try { autoLearn = localStorage.getItem("nova-auto") !== "off"; } catch (e) {}
const autoBtn = document.getElementById("autoBtn");
const showAuto = () => { autoBtn.textContent = "AUTO-LEARN: " + (autoLearn ? "ON" : "OFF"); autoBtn.setAttribute("aria-pressed", String(autoLearn)); };
showAuto();
autoBtn.addEventListener("click", () => { autoLearn = !autoLearn; try { localStorage.setItem("nova-auto", autoLearn ? "on" : "off"); } catch (e) {} showAuto(); print(autoLearn ? "Auto-learn is ON. When I don't know something, I'll search the web for it." : "Auto-learn is OFF. I'll only look things up when you ask.", "sys", true); });
document.getElementById("wikiBtn").addEventListener("click", () => { if (busy) return; q.value = "search "; q.focus(); });
const webGet = async url => {
  let r;
  try { r = await fetch(url); } catch (e) { const err = new Error("offline"); err.offline = true; throw err; }
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
};
async function lookUp(topic, auto, wantMeaning) {
  busy = true;
  later(() => setMood("think"));
  let ok = false;
  try {
    // quick check that this page is allowed online at all
    if (net === null) { try { await webGet("https://en.wiktionary.org/api/rest_v1/page/definition/test"); } catch (e) { if (e.offline) throw e; } }
    net = true;
    print(`• searching the web for "${topic}"...`, "step", true);
    const res = await webLearn(webGet, topic, t => print("• " + t, "step", true), wantMeaning);
    const a = applyWeb(res, topic);
    const failed = res.report.filter(r => r.err).map(r => r.src);
    if (!a.total) {
      const dis = res.report.find(r => r.disambig);
      print(dis ? `"${dis.disambig}" can mean several things. Try something more specific.` : `I searched, but couldn't find facts I understand about "${topic}".` + (failed.length ? ` (${failed.join(", ")} didn't answer; try again in a moment.)` : ""), "ans");
      later(() => setMood("confused", 2500));
    } else {
      const lines = [`I searched the web and taught myself ${a.total} new fact${a.total === 1 ? "" : "s"} about ${a.name || topic}:`];
      a.bySrc.forEach(b => { lines.push(`[${b.src}]`); b.facts.slice(0, 6).forEach(f => lines.push("• " + say(f))); if (b.facts.length > 6) lines.push(`  ...and ${b.facts.length - 6} more`); });
      if (failed.length) lines.push(`(${failed.join(", ")} didn't answer this time.)`);
      print(lines.join("\n"), "ans");
      ok = true; DERIVED = countDerived();
      later(() => { updateMeter(); setMood("happy", 2600); });
    }
  } catch (e) {
    net = false;
    print(auto ? "(I tried to look that up, but this page can't reach the internet.)" : "I can't reach the internet from here.", "sys", true);
    print(`claude.ai blocks pages from going online. To let me search the web, open my own copy:\n${HOME_URL}`, "ans");
    later(() => setMood("confused", 2500));
  }
  await queue; busy = false;
  return ok;
}

// ================= models =================
function boot(id, first) {
  try { localStorage.setItem("nova-model", id); } catch (e) {}
  useModel(id); DERIVED = countDerived();
  document.getElementById("mname").textContent = model.name;
  document.querySelectorAll("[data-model]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.model === id)));
  updateMeter(); draw();
  if (!first) print(`\n— switched to ${model.name} —`, "sys", true);
  print(`${model.name} ONLINE`, "sys", true);
  if (model.pack && STUDIED.entities) print(`STUDIED WIKIPEDIA ... ${STUDIED.entities.toLocaleString()} TOPICS, ${STUDIED.facts.toLocaleString()} FACTS`, "sys", true);
  if (model.pack) print(`KNOWLEDGE PACK ... ${packSize().toLocaleString()} FACTS${model.chain ? `   REASONED ... ~${DERIVED.toLocaleString()} MORE` : ""}   TAUGHT BY YOU ... ${brainSize()}`, "sys", true);
  else print(`BRAIN SCAN ... ${brainSize()} FACTS ${brainSize() ? "TAUGHT BY YOU" : "(EMPTY)"}`, "sys", true);
  print("READY.\n", "sys", true);
  const hello = {
    blank: brainSize() ? `Welcome back. I still remember the ${brainSize()} thing${brainSize() === 1 ? "" : "s"} you taught me.` : "I'm BLANK. I don't know anything yet, not even what a cat is.\nTeach me facts in plain sentences and I'll reason with them. Press DEMO LESSON to watch.",
    scholar: "I'm SCHOLAR. I studied Wikipedia before you got here, so I already know tens of thousands of facts, and I show my reasoning.\nAsk me anything from TOPICS, teach me new facts, or press SURPRISE ME.",
    mini: "I'm MINI. Same knowledge pack as SCHOLAR, but I only answer with facts I know directly. Fast and short.",
  }[id];
  print(hello);
  later(() => setMood(!model.pack && !brainSize() ? "confused" : "idle", 3000));
}
document.querySelectorAll("[data-model]").forEach(b => b.addEventListener("click", () => { if (busy || b.dataset.model === model.id) return; boot(b.dataset.model); q.focus(); }));
let start = "scholar"; try { start = localStorage.getItem("nova-model") || "scholar"; } catch (e) {}
boot(MODELS[start] ? start : "scholar", true);
})();
